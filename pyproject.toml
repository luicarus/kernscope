[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernscope"
version = "0.1.0"
description = "Reusable LLM inference operators for memory-constrained GPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]
